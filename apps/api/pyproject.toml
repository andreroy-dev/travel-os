[project]
name = "travel-os-api"
version = "0.1.0"
description = "Travel OS API. Modular monolith for Release 1."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "cryptography>=44",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic-settings>=2.7",
    "pypdf>=5.1",
    "PyJWT>=2.10",
    "python-dateutil>=2.9",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.34",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
